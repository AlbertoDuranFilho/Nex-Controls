name: deploy-db

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"

permissions:
  contents: read

concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx supabase link --project-ref "$PROJECT_REF"
      - run: npx supabase db push

  production:
    needs: staging
    runs-on: ubuntu-latest
    # Exige aprovacao manual: configure "Required reviewers" no environment "production".
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.PROD_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx supabase link --project-ref "$PROJECT_REF"
      - run: npx supabase db push
